# Builds the whole image from a clean clone, as the docs describe, to catch sources that have moved
# or gone. It takes hours, so it runs weekly rather than on every change.
name: Image

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

jobs:
  image:
    name: Build image from a clean clone
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: STM32-Smart-Home-Hub

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git cmake wget curl unzip \
            libncurses-dev flex bison libssl-dev bc \
            cpio rsync file gawk libelf-dev \
            python3 python3-pip

      - name: Fetch sources
        run: STM32-Smart-Home-Hub/tools/setup.sh

      - name: Build
        run: STM32-Smart-Home-Hub/tools/build.sh

      - name: Check the image exists
        run: test -s buildroot-src/output/images/sdcard.img
