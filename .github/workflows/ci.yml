# SmartHub CI/CD Pipeline
#
# Builds and tests the SmartHub application on multiple platforms

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  # Native build and test (x86_64 Linux)
  build-native:
    name: Build & Test (Native)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # A stalled mirror connection should fail fast and retry, rather than use up the job's time limit
      - name: Configure apt retries
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libsqlite3-dev \
            libssl-dev \
            libmosquitto-dev \
            libyaml-cpp-dev \
            nlohmann-json3-dev \
            libgtest-dev \
            libdrm-dev \
            ccache \
            lcov

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-native-${{ github.sha }}
          restore-keys: ccache-native-

      - name: Configure CMake
        working-directory: app
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSMARTHUB_BUILD_TESTS=ON \
            -DSMARTHUB_NATIVE_BUILD=ON \
            -DSMARTHUB_FETCH_LVGL=ON

      - name: Build
        working-directory: app
        run: |
          cmake --build build
          ccache --show-stats

      - name: Run tests
        working-directory: app/build
        env:
          SMARTHUB_UI_FRAME_DIR: ${{ github.workspace }}/ui-frames
        run: |
          mkdir -p "$SMARTHUB_UI_FRAME_DIR"
          ctest --output-on-failure --verbose --timeout 300

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-native
          path: app/build/Testing/
          retention-days: 7

      - name: Upload rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-frames
          path: ui-frames/
          if-no-files-found: error
          retention-days: 7

  # Cross-compilation build (ARM32)
  build-arm:
    name: Build (ARM32 Cross-compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # Long enough for a slow first download, which fills the cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # These toolchain packages are large, and the mirror can take many minutes to serve them
      - name: Restore downloaded packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: arm-apt-archives-v1

      # A stalled mirror connection should fail fast and retry, rather than use up the job's time limit
      - name: Configure apt retries
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network

      - name: Install cross-compilation toolchain
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" \
            build-essential \
            cmake \
            ninja-build \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            qemu-user-static

      - name: Install ARM cross-compile libraries
        run: |
          # Ubuntu's main mirrors only carry x86; armhf packages are on ports.ubuntu.com.
          # Pin the existing sources to amd64 so apt doesn't request armhf from them.
          sudo dpkg --add-architecture armhf
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i -E 's/^deb (https?:)/deb [arch=amd64] \1/' /etc/apt/sources.list
          fi
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          for pocket in "$codename" "$codename-updates" "$codename-security"; do
            echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports $pocket main universe"
          done | sudo tee /etc/apt/sources.list.d/armhf-ports.list
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" \
            libsqlite3-dev:armhf \
            libssl-dev:armhf \
            libmosquitto-dev:armhf \
            libyaml-cpp-dev:armhf \
            nlohmann-json3-dev
          sudo chown -R "$USER" ~/apt-archives

      - name: Configure CMake (Cross-compile)
        working-directory: app
        run: |
          cmake -B build-arm \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-linux-gnueabihf-ci.cmake \
            -DSMARTHUB_BUILD_TESTS=OFF

      - name: Build
        working-directory: app
        run: cmake --build build-arm

      - name: Verify binary
        working-directory: app
        run: |
          file build-arm/smarthub
          arm-linux-gnueabihf-readelf -h build-arm/smarthub | grep -q 'Machine:.*ARM'

  # M4 firmware: cross-compile and host-side unit tests
  build-m4:
    name: M4 Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # Long enough for a slow first download, which fills the cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # These toolchain packages are large, and the mirror can take many minutes to serve them
      - name: Restore downloaded packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: m4-apt-archives-v1

      # A stalled mirror connection should fail fast and retry, rather than use up the job's time limit
      - name: Configure apt retries
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network

      - name: Install dependencies
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib
          sudo chown -R "$USER" ~/apt-archives

      - name: Build firmware
        working-directory: m4-firmware
        run: |
          cmake -B build -G Ninja
          cmake --build build

      - name: Verify firmware
        working-directory: m4-firmware
        run: arm-none-eabi-readelf -S build/smarthub-m4.elf | grep -q '\.resource_table'

      - name: Build host tests
        working-directory: m4-firmware/tests
        run: |
          cmake -B build -G Ninja
          cmake --build build

      - name: Run host tests
        working-directory: m4-firmware/tests/build
        run: ctest --output-on-failure --timeout 300

  # Code coverage (separate job for detailed analysis)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-native

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # A stalled mirror connection should fail fast and retry, rather than use up the job's time limit
      - name: Configure apt retries
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libsqlite3-dev \
            libssl-dev \
            libmosquitto-dev \
            libyaml-cpp-dev \
            nlohmann-json3-dev \
            libgtest-dev \
            libdrm-dev \
            ccache \
            lcov

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-coverage-${{ github.sha }}
          restore-keys: ccache-coverage-

      - name: Configure with coverage
        working-directory: app
        run: |
          cmake -B build-coverage \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSMARTHUB_BUILD_TESTS=ON \
            -DSMARTHUB_COVERAGE=ON \
            -DSMARTHUB_FETCH_LVGL=ON

      - name: Build with coverage
        working-directory: app
        run: |
          cmake --build build-coverage
          ccache --show-stats

      - name: Run tests with coverage
        working-directory: app/build-coverage
        run: |
          ctest --output-on-failure
          # Generate coverage report
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/third_party/*' '*/_deps/*' '*/tests/*' --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build-coverage/coverage.info
          retention-days: 30

  # Static analysis
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # clang-tidy reads every source and LVGL's headers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # A stalled mirror connection should fail fast and retry, rather than use up the job's time limit
      - name: Configure apt retries
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libsqlite3-dev \
            libssl-dev \
            libmosquitto-dev \
            libyaml-cpp-dev \
            nlohmann-json3-dev \
            libdrm-dev \
            cppcheck \
            clang-tidy

      - name: Configure CMake
        working-directory: app
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSMARTHUB_BUILD_TESTS=OFF \
            -DSMARTHUB_NATIVE_BUILD=ON \
            -DSMARTHUB_FETCH_LVGL=ON

      - name: Run tool tests
        run: tools/tests/test_flash.sh

      - name: Run dashboard tests
        run: node web/tests/test_app.js

      - name: Check for log calls using {} placeholders
        run: |
          # The compiler catches placeholders with arguments, but not a call with none, such as
          # LOG_ERROR("Port {} failed"). Logging is printf style, so that would print {} literally.
          if grep -rnE 'LOG_(DEBUG|INFO|WARN|ERROR)\("[^"]*\{[0-9]*(:[^}]*)?\}' app/src app/include app/tests; then
            echo "Use printf formats in log calls"
            exit 1
          fi

      - name: Run cppcheck
        working-directory: app
        run: |
          # Warnings and performance fail the job. Style findings are opinions, so they aren't run.
          # virtualCallInConstructor: destructors calling their own shutdown(), which is what's meant.
          cppcheck \
            --enable=warning,performance \
            --suppress=missingIncludeSystem \
            --suppress=virtualCallInConstructor \
            --inline-suppr \
            --language=c++ \
            --std=c++17 \
            --error-exitcode=1 \
            --quiet \
            -I include \
            -I ../shared/include \
            src/

      - name: Run clang-tidy
        working-directory: app
        run: |
          # Which checks is in .clang-tidy. Every source, UI included, which needs LVGL to be there.
          run-clang-tidy -quiet -p build -j "$(nproc)" "$(pwd)/src/.*\.cpp$"

  # Summary job
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-24.04
    needs: [build-native, build-arm, build-m4, coverage, static-analysis]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          status=0
          check() {
            echo "$1: $2"
            [ "$2" = "success" ] || status=1
          }
          check "Native Build" "${{ needs.build-native.result }}"
          check "ARM Build" "${{ needs.build-arm.result }}"
          check "M4 Firmware" "${{ needs.build-m4.result }}"
          check "Coverage" "${{ needs.coverage.result }}"
          check "Static Analysis" "${{ needs.static-analysis.result }}"
          exit $status
